[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
interrupt_message = true

[agents.luna-worker]
description = "The only project worker. Handles bounded implementation, debugging, exploration, testing, refactoring, documentation, and mechanical work after the lead defines scope and direction."
config_file = "./agents/luna-worker.toml"
